<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 120px;
    color: #fff;
}

h1 { z-index: 2; position: relative; }

button {
    font-size: 20px;
    padding: 15px 30px;
    margin: 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    z-index: 2;
    position: relative;
}

.yes { background-color: #ff4d6d; color: white; }
.no { background-color: #555; color: white; }

#response {
    font-size: 28px;
    margin-top: 40px;
    z-index: 2;
    position: relative;
}

.heart {
    position: absolute;
    bottom: -20px;
    color: rgba(255, 0, 100, 0.7);
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>💌 Vrei să fii my Valentine?</h1>

<button class="yes" onclick="yes()">DA 💖</button>
<button class="no" onclick="no()">NU 💔</button>

<div id="response"></div>

<script>
function yes() {
    document.getElementById("response").innerHTML =
        "Yeeey, Ly❤️, aștept cu nerăbdare.";
    notify("DA");
}

function no() {
    document.getElementById("response").innerHTML = "…";
    notify("NU");
}

// inimioare
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}, 300);

// notificare WhatsApp
function notify(answer) {
    window.location.href =
      "https://wa.me/40765689620?text=Răspuns%20Valentine:%20" + answer;
}
</script>

</body>
</html>
